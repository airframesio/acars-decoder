spec_version: "1"
plugin:
  name: Label_44_IN
  type: text
  decode_level: FULL
qualifiers:
  labels: ["44"]
  preambles: ["00IN01", "00IN02", "00IN03", "IN01", "IN02", "IN03"]
parse:
  - { split: ",", into: data }
  - { require_length: { var: data, min: 7 }, else: fail }
fields:
  - name: position
    from: $data[1]
    decode:
      fn: coordinate_decimal_minutes
      args: { style: combined, format: "NSDDMM_M_EWDDMM_M" }
  - name: departure_icao
    from: $data[2]
    decode: { fn: airport }
  - name: arrival_icao
    from: $data[3]
    decode: { fn: airport }
  - name: month
    from: $data[4]
    decode: { fn: integer, args: { substring_start: 0, substring_length: 2 } }
  - name: day
    from: $data[4]
    decode: { fn: integer, args: { substring_start: 2, substring_length: 2 } }
  - name: in_time
    from: $data[5]
    decode: { fn: timestamp_hhmmss }
  - name: fuel_remaining
    from: $data[6]
    when: { not: { in: ["$data[6]", ["---.-"]] } }
    decode: { fn: float }
formatted:
  description: "In Gate Report"
  items:
    - { type: position, value: $position }
    - { type: airport_origin, value: $departure_icao }
    - { type: airport_destination, value: $arrival_icao }
    - { type: month, value: $month }
    - { type: day, value: $day }
    - { type: in, value: $in_time }
    - { type: fuel_remaining, value: $fuel_remaining }
    - { type: remaining_fields, from: $data, start: 7 }
