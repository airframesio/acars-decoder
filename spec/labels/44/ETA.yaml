spec_version: "1"
plugin:
  name: Label_44_ETA
  type: text
  decode_level: FULL
qualifiers:
  labels: ["44"]
  preambles: ["00ETA01", "00ETA02", "00ETA03", "ETA01", "ETA02", "ETA03"]
parse:
  - { split: ",", into: data }
  - { require_length: { var: data, min: 9 }, else: fail }
fields:
  - name: position
    from: $data[1]
    decode:
      fn: coordinate_decimal_minutes
      args: { style: combined, format: "NSDDMM_M_EWDDMM_M" }
  - name: altitude
    from: $data[2]
    decode: { fn: integer, args: { multiplier: 100 } }
  - name: departure_icao
    from: $data[3]
    decode: { fn: airport }
  - name: arrival_icao
    from: $data[4]
    decode: { fn: airport }
  - name: month
    from: $data[5]
    decode: { fn: integer, args: { substring_start: 0, substring_length: 2 } }
  - name: day
    from: $data[5]
    decode: { fn: integer, args: { substring_start: 2, substring_length: 2 } }
  - name: timestamp
    from: $data[6]
    decode: { fn: timestamp_hhmmss }
  - name: eta_time
    from: $data[7]
    decode: { fn: timestamp_hhmmss }
  - name: fuel_remaining
    from: $data[8]
    when: { not: { in: ["$data[8]", ["---.-"]] } }
    decode: { fn: float }
formatted:
  description: "ETA Report"
  items:
    - { type: position, value: $position }
    - { type: altitude, value: $altitude }
    - { type: airport_origin, value: $departure_icao }
    - { type: airport_destination, value: $arrival_icao }
    - { type: timestamp, kind: month, value: $month }
    - { type: timestamp, kind: day, value: $day }
    - { type: timestamp, kind: current, value: $timestamp }
    - { type: timestamp, kind: eta, value: $eta_time }
    - { type: fuel, kind: remaining, value: $fuel_remaining, when_present: true }
