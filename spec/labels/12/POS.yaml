spec_version: "1"
plugin:
  name: Label_12_POS
  type: text
  decode_level: PARTIAL
qualifiers:
  labels: ["12"]
  preambles: ["POS"]
parse:
  # Pure escape hatch: 8-char lat / 8-char lon substring DMS extraction, "FOB"
