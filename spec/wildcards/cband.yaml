spec_version: "1"
plugin:
  name: CBand
  type: text
  decode_level: MESSAGE
qualifiers:
  labels: ["*"]
parse:
  # Whole-plugin escape hatch (per ESCAPE_HATCHES.md guidance):
  #   - Match leading 10-char C-Band header:
  #       /^(?<msgno>[A-Z]\d{2}[A-Z])(?<airline>[A-Z0-9]{2})(?<number>[0-9]{4})/
  #   - If matched, strip first 10 chars, recursively invoke MessageDecoder on the
  #     remainder with the same label/sublabel, then merge raw/items/remaining and
  #     prepend flight number "airline + Number(number)".
  #   - decoder.name becomes "c-band-" + nested decoder name; decode level inherited.
  # Recursive MessageDecoder use is explicitly called out as a full escape-hatch case.
  custom: cband_dispatch
formatted:
  description: "C-Band Message"
  custom: cband_format
