[package]
name = "ads-runtime"
version = "0.1.0"
edition = "2021"
description = "Rust runtime library for ADS-generated ACARS decoder plugins."
license = "MIT"
repository = "https://github.com/airframesio/airframes-decoder"

[lib]
name = "ads_runtime"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
flate2 = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"
